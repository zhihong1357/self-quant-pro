name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
      - name: 安装依赖
        run: uv sync --locked
      - name: 格式与静态检查
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: 测试
        run: uv run pytest
      - name: 治理检查
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            uv run sqp check
          else
            uv run sqp check --base "$BASE"
          fi
