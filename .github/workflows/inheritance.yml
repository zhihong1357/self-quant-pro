name: inheritance

# 在干净的环境里，按 registry/inherited/manifest.json 记录的固定提交，
# 重新取出前两代的仓库、重新生成继承记录，并逐字节比对。

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - "registry/inherited/**"
      - "config/inheritance.toml"
      - "src/sqp/inherit.py"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: 安装依赖
        run: uv sync --locked
      - name: 重新生成并比对
        run: uv run sqp inherit verify
