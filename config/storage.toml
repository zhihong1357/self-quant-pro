# Google Cloud storage (decisions 0015 and 0017). None of these values is a
# secret: only scheduled or manual workflow runs on main of this repository can
# use the identity, and the bucket refuses public access.
[gcp]
project_id = "self-quant-pro"
workload_identity_provider = "projects/207119464670/locations/global/workloadIdentityPools/github/providers/self-quant-pro"
bucket = "self-quant-pro-sqp-data"

[limits]
# Downloads stop before the bucket would pass this size (decision 0018). The
# always-free tier covers 5 GB-months of Standard storage in us-central1.
max_bucket_bytes = 4_500_000_000
