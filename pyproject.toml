[project]
name = "self-quant-pro"
version = "0.0.0"
description = "第三代个人量化研究系统：治理骨架与研究工具"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sqp = "sqp.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# 报错信息是中文，全角标点是有意的
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
