id = "H-0002"
title = "中小永续合约的横截面资金费率：做多费率最低的五分之一、做空最高的五分之一，扣吃单成本后赚钱"
family = "crypto.funding"
universe = "U1"
status = "draft"
created = 2026-11-25

mechanism = "资金费率高，说明想用杠杆做多的人多、愿意承接的空头少；多头每 8 小时付钱给空头，补偿空头承担的挤空和暴涨风险。按资金费率给合约排序，做空费率最高的一组、做多最低的一组，市场中性，收入来自两部分：收到的资金费差，以及拥挤多头事后的价格回落。大合约上期现套利的资本充足，这份补偿已被压低（大币 carry 2024 年起明显变弱，研究地图第 1 节）；中小合约上套利资本最稀缺，补偿最可能还在。"
counterparty = "在中小合约上追涨、需要杠杆而不愿或不能借现货的投机者；他们为即时的杠杆多头敞口付费"
why_persistent = "杠杆需求来自散户的风险偏好，在牛市里系统性偏多；中小币的现货难借、借币成本高，做市和期现套利的资本又受保证金、交易所对手风险和资金成本限制，压不平小币的费率（套利的限制，Shleifer & Vishny 1997）"
why_us = "资金小，进得了大机构嫌容量太小的中小合约；不需要速度，按 8 小时周期调仓；没有赎回压力，扛得住挤空的阶段"
predictions = [
  "主要预测：在流动性最好的三分之一以外的合约里，每天按前一天结算的资金费率平均值（折算成 8 小时）五分组，最低组减最高组的组合（持有一天，经过三次结算），资金费加价格变动、扣吃单手续费和半个价差后，年化夏普为正",
  "推论：2022 年熊市里同方向，不只在杠杆狂热期成立",
  "推论：收益不全来自资金费，价格部分不显著为负（否则只是被挤空的风险补偿，换个时段就会亏）",
]
falsification = "扣吃单成本后的组合收益不为正；或者 2022 年方向相反；或者收益全部来自资金费、价格部分显著为负并抵消资金费"
