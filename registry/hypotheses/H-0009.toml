mechanism = "和 H-0002 相同：资金费率高，说明想用杠杆做多的人多、愿意承接的空头少，多头每 8 小时付钱给空头。做空费率最高的一组、做多最低的一组，市场中性，收入来自收到的资金费差，以及拥挤多头事后的价格回落。不同的只有调仓频率：费率的高低排名变化慢，每周按 7 天的平均值排一次，资金费差大部分还收得到，换手和成本却小得多。"
