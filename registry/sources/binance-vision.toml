# 数据源登记：Binance 公开数据站（决策 0018）。
# 下载器从这里读数据集和合约的规则；改这里就改了要同步什么。

id = "binance-vision"
name = "Binance 公开数据站（Binance Vision）"
site = "https://data.binance.vision/"
listing = "https://s3-ap-northeast-1.amazonaws.com/data.binance.vision"

[terms]
license = "CC BY-NC-SA 4.0；Binance Vision Dataset Terms 1.0（2026-08-26 更新）"
checked = 2026-11-24
research = "允许：纯个人、非生产用途的历史回测"
publish_derived = "不在本仓库发布：派生结果只放私有存储桶（决策 0011）"
live_trading = "不允许：不得用于实盘自营交易，由它得出的模型受同样约束"
see = "docs/compliance.md"

[publication]
# 官方说明：月度文件在每月的第一个周一发布；归档发布后偶尔会被替换（官方仓库有替换清单）。
monthly = "每月第一个周一发布上个月的文件"
revisions = "已发布的文件可能被替换；下载器按上游的 ETag 发现并报告"

# 合约集合。pattern 是正则表达式，按文件夹名匹配。
# 已下架、后来同名重新上架的合约，旧数据放在名字后面加 SETTLED 的文件夹里，算不同的合约。
[symbols.um-usdt-perp]
listing = "data/futures/um/monthly/klines/"
pattern = "^[0-9A-Z]+USDT(SETTLED)*$"

# 有永续合约的币的现货交易对：名字等于合约名去掉 SETTLED，或者再去掉 1000、1M 之类的倍数前缀。
[symbols.spot-of-perp]
listing = "data/spot/monthly/klines/"
pattern = "^[0-9A-Z]+USDT$"
of = "um-usdt-perp"

[[datasets]]
id = "um-funding"
prefix = "data/futures/um/monthly/fundingRate/{symbol}/"
symbols = "um-usdt-perp"
knowable = "结算时刻（calc_time）"

[[datasets]]
id = "um-klines-1h"
prefix = "data/futures/um/monthly/klines/{symbol}/1h/"
symbols = "um-usdt-perp"
knowable = "这根 K 线收盘之后（close_time）"

[[datasets]]
id = "um-mark-1h"
prefix = "data/futures/um/monthly/markPriceKlines/{symbol}/1h/"
symbols = "um-usdt-perp"
knowable = "这根 K 线收盘之后（close_time）"

[[datasets]]
id = "spot-klines-1h"
prefix = "data/spot/monthly/klines/{symbol}/1h/"
symbols = "spot-of-perp"
knowable = "这根 K 线收盘之后（close_time）；2025 年起时间戳是微秒"
